name: Publish reviewed Android release
on:
  push:
    branches: [main]
    paths: ['.github/verified-release.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate the successful Android source and run
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag .github/verified-release.json)
          TESTED_SHA=$(jq -r .sha .github/verified-release.json)
          RUN_ID=$(jq -r .run_id .github/verified-release.json)
          ARTIFACT=$(jq -r .artifact .github/verified-release.json)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$TESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > reviewed-run.json
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .conclusion == "success"' reviewed-run.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$TESTED_SHA" > tested-tree.json
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA" > current-tree.json
          python3 - <<'SOURCE'
          import json
          from pathlib import Path
          def entries(file):
            return {row['path']:row['sha'] for row in json.loads(Path(file).read_text())['tree']}
          old,new=entries('tested-tree.json'),entries('current-tree.json')
          for key in ['lib','pubspec.yaml','android']:
            assert old.get(key)==new.get(key),f'Production source changed after Android verification: {key}'
          SOURCE
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verified.outputs.artifact }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reviewed
      - name: Publish the exact APK and video that passed Android verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verified.outputs.tag }}
          TESTED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          ASSET=$(jq -r .asset .github/verified-release.json)
          TITLE=$(jq -r .title .github/verified-release.json)
          cp reviewed/release-under-test.apk "$ASSET"
          gh release create "$RELEASE_TAG" "$ASSET#Android APK" "reviewed/docs/media/demo-android.mp4#Android demo" --target "$TESTED_SHA" --title "$TITLE" --notes-file release-notes.md
