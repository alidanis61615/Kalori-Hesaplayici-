name: Android demo and persistence
on:
  push:
    branches: [feature/kalori-takip-1.2.0, main]
    paths: ['lib/**', 'integration_test/**', 'test_driver/**', 'scripts/**', 'pubspec.yaml', '.github/workflows/android-demo.yml']
  workflow_dispatch:
concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name kalori_hesaplayici .
          rm -f test/widget_test.dart
          python3 - <<'LABEL'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(re.sub(r'android:label="[^"]*"','android:label="Kalori Takip"',manifest.read_text()))
          LABEL
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 60s
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Prebuild application and instrumentation
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk release-under-test.apk
          flutter build apk --debug --target=integration_test/portfolio_test.dart
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android workflows and record actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-demo.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
      - name: Upload screens, video, release APK and persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kalori-Takip-Android-Demo
          path: |
            docs/media/
            release-under-test.apk
          if-no-files-found: error
          retention-days: 30

  publish-reviewed-release:
    if: github.ref == 'refs/heads/main'
    needs: android-demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kalori-Takip-Android-Demo
          path: reviewed
      - name: Publish the APK that passed Android checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reviewed/release-under-test.apk Kalori-Takip-Android.apk
          gh release create v1.2.0 "Kalori-Takip-Android.apk#Android APK" "reviewed/docs/media/demo-android.mp4#Android demo" --target "$GITHUB_SHA" --title "Kalori Takip v1.2.0" --notes-file release-notes.md
